<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No-Brainer Decks — Sheva Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Mono:wght@400;700&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#6020D0;
    --violet-2:#7C3AED;
    --teal:#0891B2;
    --teal-2:#06B6D4;
    --grad-full:linear-gradient(100deg,var(--violet) 0%,var(--violet-2) 45%,var(--teal) 100%);
    --bg:#100E1A;
    --card:#1B1830;
    --card-2:#221E3B;
    --line:#332E52;
    --ink:#F3F1F8;
    --muted:#A9A3BE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Lexend',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .shell{max-width:1100px;margin:0 auto;padding:0 clamp(18px,4vw,48px)}

  /* nav */
  .site-nav{border-bottom:1px solid var(--line);background:rgba(16,14,26,.9);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
  .site-nav .shell{padding:16px clamp(18px,4vw,48px);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .nav-home{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink)}
  .nav-mark{width:24px;height:24px;border-radius:7px;background:var(--grad-full);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:13px;color:#fff}
  .nav-word{font-family:'Space Mono',monospace;font-size:12.5px;font-weight:700;letter-spacing:.06em}
  .nav-links{display:flex;gap:4px;flex-wrap:wrap}
  .nav-link{font-size:13.5px;font-weight:500;color:var(--muted);text-decoration:none;padding:7px 14px;border-radius:999px;transition:background .15s ease,color .15s ease}
  .nav-link:hover{background:var(--card-2);color:var(--ink)}
  .nav-link.current{background:var(--grad-full);color:#fff}

  main{padding:clamp(36px,6vw,60px) 0 80px}
  .page-eyebrow{font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
  .page-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(24px,3.6vw,34px);margin-bottom:clamp(28px,5vw,44px)}

  /* deck viewer */
  .deck-viewer{display:grid;grid-template-columns:1fr;gap:20px}
  @media (min-width:860px){.deck-viewer{grid-template-columns:1fr 300px}}

  .hero-row{display:flex;align-items:center;gap:14px}
  .arrow-btn{
    flex-shrink:0;width:40px;height:40px;border-radius:50%;
    background:var(--card);border:1px solid var(--line);color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:border-color .15s ease,transform .15s ease;
  }
  .arrow-btn:hover{border-color:var(--teal);transform:scale(1.06)}
  .arrow-btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .arrow-btn svg{width:18px;height:18px}

  .hero-card{
    flex:1;min-width:0;position:relative;overflow:hidden;border-radius:20px;
    background:linear-gradient(160deg,var(--card-2) 0%,var(--card) 100%);
    border:1px solid var(--line);padding:clamp(28px,5vw,48px);min-height:280px;
    display:flex;flex-direction:column;justify-content:center;
  }
  .hero-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--grad-full);
  }
  .hero-card::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:0 0 60px -10px rgba(124,58,237,.25) inset;
  }
  .deck-eyebrow{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-2);margin-bottom:14px}
  .deck-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.12;margin-bottom:16px;max-width:20ch}
  .deck-desc{color:var(--muted);font-size:15.5px;font-weight:300;max-width:52ch;line-height:1.65}
  .deck-counter{
    position:absolute;right:clamp(20px,4vw,40px);bottom:clamp(14px,3vw,24px);
    font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(40px,7vw,64px);
    color:var(--line);line-height:1;
  }

  /* sidebar */
  .sidebar{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:26px 24px;display:flex;flex-direction:column;gap:20px;
  }
  .bullet{display:flex;gap:12px;align-items:flex-start}
  .bullet-icon{
    flex-shrink:0;width:34px;height:34px;border-radius:10px;
    background:var(--card-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--teal-2);
  }
  .bullet-icon svg{width:17px;height:17px}
  .bullet-label{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;margin-bottom:3px}
  .bullet-text{font-size:13px;color:var(--muted);font-weight:300;line-height:1.5}
  .download-btn{
    margin-top:4px;width:100%;text-align:center;
    background:var(--grad-full);color:#fff;border:none;border-radius:12px;
    padding:13px 16px;font-family:'Lexend',sans-serif;font-weight:600;font-size:14px;
    cursor:pointer;text-decoration:none;display:block;
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .download-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(124,58,237,.35)}
  .download-btn.is-soon{
    background:none;border:1px dashed var(--line);color:var(--muted);
    cursor:default;font-weight:500;
  }
  .download-btn.is-soon:hover{transform:none;box-shadow:none}

  /* filmstrip */
  .filmstrip{margin-top:24px;display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
  .film-item{
    flex-shrink:0;width:150px;height:96px;border-radius:12px;padding:14px;
    background:var(--card);border:1.5px solid var(--line);cursor:pointer;
    display:flex;flex-direction:column;justify-content:space-between;
    transition:border-color .15s ease,transform .15s ease;
    font-family:'Lexend',sans-serif;
  }
  .film-item:hover{transform:translateY(-2px)}
  .film-item.active{border-color:var(--teal-2);box-shadow:0 0 0 1px var(--teal-2),0 8px 20px -6px rgba(6,182,212,.4)}
  .film-num{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted)}
  .film-title{font-size:12.5px;font-weight:500;line-height:1.3}

  .note{margin-top:32px;font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);max-width:60ch;line-height:1.7}
</style>
</head>
<body>

<nav class="site-nav">
  <div class="shell">
    <a href="index.html" class="nav-home">
      <span class="nav-mark">S</span>
      <span class="nav-word">SHEVA STUDIO</span>
    </a>
    <div class="nav-links">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="guides.html">Guides</a>
      <a class="nav-link" href="prompt-builder.html">Prompt Builder</a>
      <a class="nav-link current" href="no-brainer-decks.html">No-Brainer Decks</a>
      <a class="nav-link" href="card-flip-generator.html">Build Your Own</a>
    </div>
  </div>
</nav>

<main>
  <div class="shell">
    <p class="page-eyebrow">Grab &amp; Go</p>
    <h1 class="page-title">No-Brainer Decks</h1>

    <div class="deck-viewer">
      <div>
        <div class="hero-row">
          <button class="arrow-btn" id="prevBtn" aria-label="Previous deck">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="hero-card" id="heroCard">
            <p class="deck-eyebrow" id="deckEyebrow">Introducing</p>
            <h2 class="deck-title" id="deckTitle"></h2>
            <p class="deck-desc" id="deckDesc"></p>
            <span class="deck-counter" id="deckCounter"></span>
          </div>
          <button class="arrow-btn" id="nextBtn" aria-label="Next deck">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>

        <div class="filmstrip" id="filmstrip"></div>
      </div>

      <aside class="sidebar" id="sidebar">
        <!-- bullets injected here -->
        <span class="download-btn is-soon" aria-disabled="true">Downloads coming soon</span>
      </aside>
    </div>

    <p class="note">These decks are previews &mdash; downloads open here soon. In the meantime, <a href="index.html#connect" style="color:var(--teal-2);">find me where you already scroll</a> for the same ideas in short form.</p>
  </div>
</main>

<script>
  const ICONS = {
    flame: '<path d="M12 2c1 3-2 4-2 7a4 4 0 008 0c0-2-1-3-1-3s2 2 2 6a7 7 0 11-14 0c0-5 4-7 7-10z"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    star: '<path d="M12 2l2.9 6.6L22 9.3l-5 4.9 1.2 7.1L12 17.8l-6.2 3.5L7 14.2 2 9.3l7.1-.7z"/>',
    timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
    repeat: '<path d="M17 2l4 4-4 4M3 12v-2a4 4 0 014-4h14M7 22l-4-4 4-4M21 12v2a4 4 0 01-4 4H3"/>',
    users: '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>',
    eye: '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>'
  };
  function svg(name){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[name]+'</svg>';
  }

  const decks = [
    {
      title:"The Dopamine Challenge",
      desc:"Your brain skips the easy task and races toward the impossible one. This deck gives it a target it actually wants to chase — one spark, one timer, one win at a time.",
      bullets:[
        {icon:"flame", label:"The Challenge", text:"Your brain refuses to start. This deck gives it a reason to."},
        {icon:"target", label:"Your Target", text:"Pick one task. Set a 2-minute timer. Beat it."},
        {icon:"star", label:"The Payoff", text:"Small wins stack. That's the whole system."}
      ]
    },
    {
      title:"The 2-Minute Rule",
      desc:"Gamification wakes up an ADHD brain faster than willpower ever will. Set the timer. Race it. Watch what happens when the task becomes a game instead of a wall.",
      bullets:[
        {icon:"timer", label:"Set It", text:"Two minutes on the clock. No negotiating."},
        {icon:"target", label:"Beat It", text:"Race the timer, not the to-do list."},
        {icon:"repeat", label:"Repeat It", text:"Momentum builds on the second round, not the first."}
      ]
    },
    {
      title:"Object Permanence Fix",
      desc:"If you can't see it, it doesn't exist — until it reappears somewhere else entirely. A deck for the wrench that vanished and the keys that never stay put.",
      bullets:[
        {icon:"eye", label:"The Glitch", text:"Out of sight really does mean out of mind."},
        {icon:"target", label:"The Fix", text:"Visible storage beats organized storage, every time."},
        {icon:"star", label:"The Win", text:"You stop losing the thing. That's the whole goal."}
      ]
    },
    {
      title:"Body Double Mode",
      desc:"Pick your mode: silent coworker, hype coach, or accountability stare. Three ways to borrow focus when yours won't show up on its own.",
      bullets:[
        {icon:"users", label:"Silent Mode", text:"Someone just... in the room. That's enough."},
        {icon:"flame", label:"Hype Mode", text:"Loud encouragement, on purpose, out loud."},
        {icon:"eye", label:"Stare Mode", text:"The gentle pressure of being watched, working."}
      ]
    }
  ];

  let current = 0;
  const heroCard = document.getElementById('heroCard');
  const deckTitle = document.getElementById('deckTitle');
  const deckDesc = document.getElementById('deckDesc');
  const deckCounter = document.getElementById('deckCounter');
  const sidebar = document.getElementById('sidebar');
  const filmstrip = document.getElementById('filmstrip');
  const downloadBtn = document.getElementById('downloadBtn');

  function pad(n){ return n < 10 ? '0'+n : ''+n; }

  function render(){
    const d = decks[current];
    deckTitle.textContent = d.title;
    deckDesc.textContent = d.desc;
    deckCounter.textContent = pad(current+1);

    sidebar.innerHTML = d.bullets.map(b => `
      <div class="bullet">
        <span class="bullet-icon">${svg(b.icon)}</span>
        <div>
          <div class="bullet-label">${b.label}</div>
          <div class="bullet-text">${b.text}</div>
        </div>
      </div>
    `).join('') + '<span class="download-btn is-soon" aria-disabled="true">Downloads coming soon</span>';

    Array.from(filmstrip.children).forEach((el,i)=>{
      el.classList.toggle('active', i===current);
    });
  }

  filmstrip.innerHTML = decks.map((d,i) => `
    <div class="film-item" data-i="${i}">
      <span class="film-num">${pad(i+1)}</span>
      <span class="film-title">${d.title}</span>
    </div>
  `).join('');

  filmstrip.querySelectorAll('.film-item').forEach(el=>{
    el.addEventListener('click', ()=>{ current = parseInt(el.dataset.i,10); render(); });
  });

  document.getElementById('prevBtn').addEventListener('click', ()=>{
    current = (current - 1 + decks.length) % decks.length; render();
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    current = (current + 1) % decks.length; render();
  });

  render();
</script>

</body>
</html>
